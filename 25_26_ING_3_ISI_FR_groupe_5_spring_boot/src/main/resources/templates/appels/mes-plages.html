<!DOCTYPE html>
<html lang="fr" data-theme="dark"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">
<head>
    <title>Mes cours — CarnetRouge</title>
</head>
<body>

<div layout:fragment="content">
    <div class="max-w-[1200px] mx-auto">

        <!-- Page Header -->
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
            <div>
                <h1 class="font-serif text-[clamp(1.8rem,4vw,2.4rem)] leading-[1.1] text-gray-100 mb-2">
                    Mes <span class="text-primary italic">cours</span>
                </h1>
                <p class="text-[14px] text-gray-400">Gérez les appels de présence pour vos cours.</p>
            </div>
            <span class="text-[13px] text-gray-500" th:text="${currentInstitutName}"></span>
        </div>

        <!-- Messages -->
        <div th:if="${succes}" class="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-sm flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            <span th:text="${succes}"></span>
        </div>

        <!-- État vide -->
        <div th:if="${#lists.isEmpty(plages)}" class="bg-bgcard border border-white/5 rounded-[22px] p-12 text-center">
            <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-bgsubtle/50 border border-white/5 flex items-center justify-center">
                <svg class="w-10 h-10 text-gray-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
            </div>
            <p class="text-gray-400 font-medium text-lg mb-1">Aucun cours trouvé</p>
            <p class="text-[13px] text-gray-500">Vous n'avez pas de cours programmés pour le moment.</p>
        </div>

        <!-- Liste des plages -->
        <div th:if="${not #lists.isEmpty(plages)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div th:each="plage : ${plages}" class="bg-bgcard border border-white/5 rounded-[18px] p-5 hover:border-white/10 transition-all group">

                <!-- En-tête -->
                <div class="flex items-start justify-between gap-3 mb-3">
                    <div class="min-w-0">
                        <h3 class="font-semibold text-gray-200 text-[15px] leading-tight" th:text="${plage.titre}">Titre</h3>
                        <p class="text-[12px] text-gray-500 mt-0.5" th:text="${plage.classe?.nom}">Classe</p>
                    </div>
                    <span class="shrink-0 px-2.5 py-1 rounded-full text-[10px] font-bold bg-primary/10 text-primary border border-primary/20" th:text="${plage.typeSeance}">CM</span>
                </div>

                <!-- Infos -->
                <div class="space-y-1.5 mb-4 text-[12px] text-gray-400">
                    <div class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        <span th:text="${plage.jour} + ' ' + ${plage.heureDebut} + ' - ' + ${plage.heureFin}"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5"/></svg>
                        <span th:text="${plage.salle ?: 'Non définie'}"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <span th:text="${plage.nbHeure} + 'h'"></span>
                    </div>
                </div>

                <!-- Action -->
                <a th:href="@{/enseignant/appels/{id}(id=${plage.id})}"
                   class="btn bg-primary hover:bg-primaryhover border-none text-white font-medium w-full h-9 rounded-xl text-sm">
                    📋 Faire l'appel
                </a>
            </div>
        </div>

    </div>
</div>
</body>
</html>
