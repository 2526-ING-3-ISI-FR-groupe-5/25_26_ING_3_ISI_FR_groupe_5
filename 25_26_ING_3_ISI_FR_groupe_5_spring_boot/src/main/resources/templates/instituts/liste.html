<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">
<head>
    <title>Instituts — CarnetRouge</title>
</head>
<body>

<div layout:fragment="content">
    <div class="max-w-300 mx-auto">

        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3 mb-6">
            <div>
                <h1 class="font-serif text-[clamp(1.6rem,4vw,2rem)] leading-[1.1] text-gray-100 mb-1">
                    Instituts <span class="text-primary italic">académiques</span>
                </h1>
                <p class="text-[13px] text-gray-400">Gérez les instituts de la plateforme.</p>
            </div>
            <button type="button" onclick="document.getElementById('modal-creer').showModal()"
                    class="btn btn-sm bg-primary hover:bg-primaryhover border-none text-white font-medium rounded-xl h-9 px-4 flex items-center gap-1.5 shadow-[0_0_15px_rgba(79,126,248,0.2)]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                Nouvel institut
            </button>
        </div>

        <div th:if="${succes}" class="mb-4 p-2.5 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-[13px] flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            <span th:text="${succes}"></span>
        </div>
        <div th:if="${erreur}" class="mb-4 p-2.5 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-[13px] flex items-center gap-2">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            <span th:text="${erreur}"></span>
        </div>

        <div class="flex items-center gap-2 mb-5">
            <form th:action="@{/admin/instituts}" method="get" class="flex items-center gap-2 flex-1">
                <div class="relative flex-1 max-w-xs">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                    </svg>
                    <input type="text" name="search" th:value="${search}" placeholder="Rechercher un institut..."
                           class="input w-full bg-gray-50 dark:bg-bgsurface
                            border-gray-300 dark:border-white/10 focus:border-primary
                             focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all
                             duration-200 rounded-xl"
                           >
                </div>
                <button type="submit" class="btn btn-sm bg-primary hover:bg-primaryhover border-none text-white rounded-lg h-8 px-3 text-xs font-medium">
                    Rechercher
                </button>
                <a th:if="${search != null}" th:href="@{/admin/instituts}" class="btn btn-sm btn-ghost border border-white/5 text-gray-400 hover:text-white rounded-lg h-8 px-2.5 text-xs">
                    Effacer
                </a>
            </form>
            <span class="text-[11px] text-gray-500 shrink-0 hidden sm:inline" th:text="${totalItems} + ' résultat(s)'">0 résultat(s)</span>
        </div>

        <div th:if="${#lists.isEmpty(instituts)}" class="bg-bgcard border border-white/5 rounded-[18px] p-10 text-center">
            <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-bgsubtle/50 border border-white/5 flex items-center justify-center">
                <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>
                </svg>

            </div>
            <p class="text-gray-400 font-medium mb-1">Aucun institut trouvé</p>
            <p class="text-[13px] text-gray-500" th:if="${search != null}">Aucun résultat pour "<span th:text="${search}"></span>"</p>
            <p class="text-[13px] text-gray-500" th:unless="${search != null}">Commencez par créer un institut</p>
        </div>

        <div th:if="${not #lists.isEmpty(instituts)}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-8">
            <div th:each="institut : ${instituts}"
                 class="bg-bgcard border border-white/5 rounded-[16px] p-4 hover:border-white/10 transition-all group">

                <div class="flex items-start justify-between gap-2 mb-3">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-10 h-10 rounded-lg bg-primary/10 border border-primary/20 flex items-center justify-center text-primary font-bold shrink-0"
                             th:text="${#strings.substring(institut.nom,0,1)}">I</div>
                        <div class="min-w-0">
                            <div class="font-semibold text-gray-200 text-[13px] leading-tight truncate" th:text="${institut.nom}">Nom</div>
                            <div class="text-[11px] text-gray-500 flex items-center gap-1 mt-0.5">
                                <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="10" r="3"/><path d="M12 2C8 2 4 6 4 10c0 6 8 14 8 14s8-8 8-14c0-4-4-8-8-8z"/></svg>
                                <span class="truncate" th:text="${institut.ville}">Ville</span>
                            </div>
                        </div>
                    </div>
                    <span class="shrink-0 inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-400/10 text-blue-400 border border-blue-400/20">
                        <span th:text="${institut.nombreEcoles}">0</span> école(s)
                    </span>
                </div>

                <div class="space-y-1.5 mb-3 text-[12px] text-gray-400">
                    <div class="flex items-center gap-1.5">
                        <svg class="w-3 h-3 text-gray-500 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <span class="truncate" th:text="${institut.email}">email</span>
                    </div>
                    <div th:if="${institut.telephone}" class="flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15"
                             height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             class="lucide lucide-phone-call-icon lucide-phone-call text-gray-500"><path d="M13 2a9 9 0 0 1 9 9"/><path d="M13 6a5 5 0 0 1 5 5"/><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/></svg>
                        <span th:text="${institut.telephone}"></span>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-1 pt-2.5 border-t border-white/5">
                    <a th:href="@{/admin/instituts/{id}(id=${institut.id})}" class="btn btn-square btn-xs btn-ghost text-amber-400 hover:bg-amber-400/10 rounded-lg" title="Voir">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                             class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle
                                cx="12" cy="12" r="3"/></svg>
                    </a>
                    <a th:href="@{/admin/instituts/{id}/modifier(id=${institut.id})}" class="btn btn-square btn-xs btn-ghost text-primary hover:bg-primary/10 rounded-lg" title="Modifier">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil-icon lucide-pencil">
                            <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
                            <path d="m15 5 4 4"/></svg>
                    </a>
                    <form th:action="@{/admin/instituts/{id}/supprimer(id=${institut.id})}" method="post" onsubmit="return confirm('Supprimer ?')">
                        <button type="submit" class="btn btn-square btn-xs btn-ghost text-red-400 hover:bg-red-400/10 rounded-lg" title="Supprimer">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-icon lucide-trash"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path
                                    d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div th:if="${totalPages > 1}" class="flex justify-center items-center gap-1 pb-6">
            <a th:if="${currentPage > 0}" th:href="@{/admin/instituts(page=${currentPage - 1}, size=${size}, search=${search})}"
               class="btn btn-xs btn-ghost border border-white/5 text-gray-400 hover:text-white rounded-lg">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
            </a>
            <a th:each="i : ${#numbers.sequence(0, totalPages > 0 ? totalPages - 1 : 0)}"
               th:href="@{/admin/instituts(page=${i}, size=${size}, search=${search})}" th:text="${i + 1}"
               class="btn btn-xs border text-[11px] font-medium transition-colors rounded-lg"
               th:classappend="${i == currentPage} ? 'bg-primary/20 text-primary border-primary/30' : 'bg-transparent text-gray-400 border-white/5 hover:text-white hover:bg-bgsurface'">
            </a>
            <a th:if="${currentPage < totalPages - 1}" th:href="@{/admin/instituts(page=${currentPage + 1}, size=${size}, search=${search})}"
               class="btn btn-xs btn-ghost border border-white/5 text-gray-400 hover:text-white rounded-lg">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
            </a>
        </div>
    </div>

    <dialog id="modal-creer" class="modal backdrop:bg-black/70">
        <div class="modal-box bg-bgcard border border-white/10 max-w-md w-full p-6 rounded-2xl shadow-2xl">
            <h3 class="text-lg font-serif text-gray-100 mb-4">Nouvel institut</h3>
            <form th:action="@{/admin/instituts/creer}" th:object="${form}" method="post" class="space-y-3">
                <div class="form-control">
                    <label class="label py-0.5"><span class="label-text text-gray-400 text-xs uppercase">Nom <span class="text-red-400">*</span></span></label>
                    <input type="text" th:field="*{nom}" placeholder="Ex: Université de Yaoundé I"
                           class="input w-full bg-gray-50 dark:bg-bgsurface
                            border-gray-300 dark:border-white/10 focus:border-primary
                             focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all
                             duration-200 rounded-xl"



                           required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="form-control">
                        <label class="label py-0.5"><span class="label-text text-gray-400 text-xs uppercase">Ville <span class="text-red-400">*</span></span></label>
                        <input type="text" th:field="*{ville}" placeholder="Ex: Yaoundé"
                               class="input w-full bg-gray-50 dark:bg-bgsurface
                            border-gray-300 dark:border-white/10 focus:border-primary
                             focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all
                             duration-200 rounded-xl"
                               required>
                    </div>
                    <div class="form-control">
                        <label class="label py-0.5"><span class="label-text text-gray-400 text-xs uppercase">Localité</span></label>
                        <input type="text" th:field="*{localite}" placeholder="Ex: Ngoa-Ekellé"
                               class="input w-full bg-gray-50 dark:bg-bgsurface
                            border-gray-300 dark:border-white/10 focus:border-primary
                             focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all
                             duration-200 rounded-xl"
                               required>
                    </div>
                </div>
                <div class="form-control">
                    <label class="label py-0.5"><span class="label-text text-gray-400 text-xs uppercase">Adresse</span></label>
                    <input type="text" th:field="*{adresse}" placeholder="Ex: BP 337, Yaoundé"
                           class="input w-full bg-gray-50 dark:bg-bgsurface
                            border-gray-300 dark:border-white/10 focus:border-primary
                             focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all
                             duration-200 rounded-xl"
                           required>
                </div>
                <div class="form-control">
                    <label class="label py-0.5"><span class="label-text text-gray-400 text-xs uppercase">Email <span class="text-red-400">*</span></span></label>
                    <input type="email" th:field="*{email}" placeholder="contact@institut.edu"
                           class="input w-full bg-gray-50 dark:bg-bgsurface
                            border-gray-300 dark:border-white/10 focus:border-primary
                             focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all
                             duration-200 rounded-xl"
                           required>
                </div>
                <div class="form-control">
                    <label class="label py-0.5"><span class="label-text text-gray-400 text-xs uppercase">Téléphone</span></label>
                    <input type="tel" th:field="*{telephone}" placeholder="Ex: +237 222 31 40 27"
                           class="input w-full bg-gray-50 dark:bg-bgsurface
                            border-gray-300 dark:border-white/10 focus:border-primary
                             focus:ring-2 focus:ring-primary/20 focus:outline-none transition-all
                             duration-200 rounded-xl"
                           required>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="submit" class="flex-1 btn bg-primary hover:bg-primaryhover border-none text-white font-medium rounded-xl h-10">Créer</button>
                    <button type="button" onclick="document.getElementById('modal-creer').close()"
                            class="flex-1 btn btn-ghost border border-white/10 hover:bg-bgsurface text-gray-400 font-medium rounded-xl h-10">Annuler</button>
                </div>
            </form>
        </div>
    </dialog>
</div>

</body>
</html>
