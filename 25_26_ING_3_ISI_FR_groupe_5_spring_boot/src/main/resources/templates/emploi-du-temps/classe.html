<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}" />
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}" />

    <title th:text="'Emploi du Temps — ' + ${classe.nom}">Emploi du Temps</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script th:inline="javascript">
        const BASE_URL = /*[[@{/enseignant/emploi-du-temps}]]*/ '/enseignant/emploi-du-temps';
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f5f4f0; --surface: #fff; --border: #e4e1d8;
            --text: #181714; --t2: #6a6760; --t3: #b0ada5;
            --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
            --sb: 285px; --r: 8px;
        }
        html, body { height: 100%; overflow: hidden; }
        body { background: var(--bg); font-family: var(--font); color: var(--text); display: flex; flex-direction: column; }

        /* ── TOPBAR ── */
        #topbar { height: 50px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 10; }
        .logo { font-size: 13px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--t2); }
        .nav { display: flex; align-items: center; gap: 8px; }
        .nb { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--t2); transition: background .12s; }
        .nb:hover { background: var(--bg); }
        #wlabel { font-family: var(--mono); font-size: 12px; min-width: 210px; text-align: center; color: var(--text); }
        #winput { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; background: var(--bg); color: var(--text); outline: none; cursor: pointer; }

        /* ── APP & SIDEBAR ── */
        #app { display: flex; flex: 1; overflow: hidden; }
        #sb { width: var(--sb); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        #sb-header { padding: 15px 14px 10px; border-bottom: 1px solid var(--border); }
        #sb-header h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text); }
        #sb-header p { font-size: 12px; color: var(--t2); line-height: 1.5; margin-top: 5px; }

        #sb-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
        #sb-body::-webkit-scrollbar { width: 3px; }
        #sb-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ── FORM ELEMENTS ── */
        .lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--t3); margin-bottom: 5px; display: block; }
        .fg { display: flex; flex-direction: column; }
        .fg input[type=text] { border: 1px solid var(--border); border-radius: var(--r); padding: 8px 11px; font-family: var(--font); font-size: 13px; color: var(--text); background: var(--bg); outline: none; width: 100%; transition: border-color .12s; }

        /* ── CHIPS ── */
        .chip-grid { display: flex; flex-wrap: wrap; gap: 5px; max-height: 150px; overflow-y: auto; }
        .chip { padding: 5px 10px; border-radius: 100px; border: 1px solid var(--border); font-size: 12px; font-weight: 500; cursor: pointer; transition: all .13s; color: var(--t2); background: var(--bg); user-select: none; white-space: nowrap; }
        .chip:hover { border-color: var(--t2); color: var(--text); }
        .chip.on { background: var(--text); color: #fff; border-color: var(--text); }

        /* ── SWATCHES ── */
        .sw-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .sw { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .1s, border-color .1s; flex-shrink: 0; }
        .sw:hover, .sw.on { border-color: var(--text); transform: scale(1.16); }
        .sw-pick { position: relative; width: 22px; height: 22px; border-radius: 50%; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--t3); cursor: pointer; flex-shrink: 0; transition: border-color .1s; }
        .sw-pick.on { border-color: var(--text); transform: scale(1.16); }
        .sw-pick input { position: absolute; opacity: 0; width: 0; height: 0; }

        /* ── BUTTONS ── */
        .cta { padding: 9px 12px; border-radius: var(--r); border: none; background: var(--text); color: #fff; font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
        .cta:hover { opacity: .82; }
        .ghost { width: 100%; padding: 8px 10px; border-radius: var(--r); border: 1px solid var(--border); background: transparent; font-family: var(--font); font-size: 12px; color: var(--t2); cursor: pointer; transition: background .12s; text-align: left; }
        .ghost:hover { background: var(--bg); }
        .ghost.danger { color: #dc2626; border-color: #fca5a5; text-align: center; margin-top: 10px; }
        .div { height: 1px; background: var(--border); flex-shrink: 0; margin: 10px 0; }

        /* ── DRAG CARDS ── */
        .cards-list { display: flex; flex-direction: column; gap: 5px; }
        .dc { padding: 9px 11px; border-radius: var(--r); cursor: grab; color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.14); transition: transform .1s, box-shadow .1s; user-select: none; display: flex; flex-direction: column; gap: 2px; position: relative; }
        .dc:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,.17); }
        .dc:active { cursor: grabbing; }
        .dc-t { font-size: 12px; font-weight: 600; }
        .dc-badge { font-size: 9px; opacity: .65; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }

        /* ── CALENDAR ── */
        #cal { flex: 1; overflow: hidden; display: flex; position: relative; }
        #calendar { flex: 1; }
        .fc { height: 100%; font-family: var(--font) !important; }
        .fc-theme-standard th { background: var(--surface); border-color: var(--border) !important; }
        .fc-theme-standard td, .fc-theme-standard .fc-scrollgrid { border-color: var(--border) !important; }
        .fc-col-header-cell { padding: 10px 0 !important; }
        .fc-col-header-cell-cushion { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--t2); text-decoration: none !important; }
        .fc-timegrid-slot { height: 40px !important; }
        .fc-timegrid-slot-label-cushion, .fc-timegrid-axis-cushion { font-family: var(--mono); font-size: 10px; color: var(--t3); }
        .fc-toolbar { display: none !important; }
        .fc-day-today { background: rgba(0,0,0,.012) !important; }

        /* Event inner */
        .fc-v-event { border: none !important; border-radius: 5px !important; box-shadow: 0 1px 5px rgba(0,0,0,.13) !important; overflow: visible !important; }
        .fc-event-main { padding: 0 !important; height: 100%; overflow: hidden; border-radius: 5px; cursor: pointer; }
        .ev { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 5px 8px; overflow: hidden; position: relative; }
        .ev-t { font-size: 11px; font-weight: 600; color: #fff; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ev-s { font-size: 10px; color: rgba(255,255,255,.75); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ev-pause { height: 100%; display: flex; align-items: center; justify-content: center; }
        .ev-pause span { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.88); letter-spacing: .07em; text-transform: uppercase; }

        /* ── Poignée de redimensionnement HAUT ── */
        .fc-event-resizer-start {
            top: 0 !important;
            bottom: auto !important;
            cursor: n-resize !important;
            height: 8px !important;
            background: rgba(255,255,255,0.3) !important;
            border-radius: 5px 5px 0 0 !important;
        }

        /* ── MODAL ── */
        #mbg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.22); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        #mbg.on { display: flex; }
        #modal { background: var(--surface); border-radius: 12px; width: 340px; padding: 22px; box-shadow: 0 16px 48px rgba(0,0,0,.14); display: flex; flex-direction: column; gap: 16px; }
        #modal h3 { font-size: 16px; font-weight: 600; color: var(--text); }
        .mrow { display: flex; gap: 8px; margin-top: 5px; }
        .mrow button { padding: 9px; border-radius: 7px; font-family: var(--font); font-size: 13px; cursor: pointer; transition: opacity .12s; border: none; }
        .mc { background: transparent; border: 1px solid var(--border); color: var(--t2); flex: 1; }
        .md { background: #dc2626; color: #fff; font-weight: 500; flex: 1; }
        .md:hover { opacity: .85; }
        .msave { flex: 2; }

        /* ── TOAST ── */
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(50px); opacity: 0; background: var(--text); color: #fff; padding: 9px 18px; border-radius: 100px; font-size: 12px; font-weight: 500; z-index: 300; transition: transform .25s, opacity .25s; pointer-events: none; white-space: nowrap; }
        #toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="topbar">
    <div class="logo">
        <span th:text="${classe.nom + ' - ' + classe.filiere}">Classe</span>
    </div>
    <div class="nav">
        <button class="nb" id="btn-prev">‹</button>
        <span id="wlabel">—</span>
        <button class="nb" id="btn-next">›</button>
        <input type="date" id="winput" />
    </div>
    <div style="width:120px"></div>
</div>

<div id="app">
    <div id="sb">
        <div id="sb-header">
            <h2>Matières programmées</h2>
            <p>Glissez une UE sur le calendrier pour la planifier.</p>
        </div>
        <div id="sb-body">
            <div class="dc fc-event dc-pause"
                 data-title="PAUSE" data-color="#52525b" data-pause="1"
                 style="background:#52525b; margin-bottom: 10px;">
                <div class="dc-t">⏸ Pause / Repas</div>
                <div class="dc-badge">Glisser-déposer</div>
            </div>
            <div class="cards-list" id="matieres-list">
                <div th:each="prog : ${programmations}"
                     class="dc fc-event"
                     th:data-prog-id="${prog.id}"
                     th:data-title="${prog.ue.code + ' - ' + prog.ue.nom}"
                     data-color="#1e3a5f" data-pause="0"
                     style="background:#1e3a5f">
                    <div class="dc-t" th:text="${prog.ue.code + ' - ' + prog.ue.nom}"></div>
                    <div class="dc-badge">Glisser pour configurer</div>
                </div>
            </div>
        </div>
    </div>

    <div id="cal">
        <div id="calendar"></div>
    </div>
</div>

<div id="mbg">
    <div id="modal">
        <h3 id="m-titre-matiere">Titre de la matière</h3>
        <p id="m-desc-pause" style="display:none; font-size:13px; color:var(--t2);">Voulez-vous supprimer cette pause ?</p>
        <div id="m-config-cours">
            <div class="fg" style="margin-bottom: 12px;">
                <label class="lbl">Salle (optionnel)</label>
                <input type="text" id="m-salle" placeholder="Ex: Salle 302" />
            </div>
            <div class="fg">
                <label class="lbl">Enseignants</label>
                <div class="chip-grid" id="m-teacher-chips">
                    <div th:each="ens : ${enseignants}"
                         class="chip chip-modal"
                         th:data-prof-id="${ens.id}"
                         th:text="${ens.nom + ' ' + ens.prenom}">
                    </div>
                </div>
            </div>
            <div class="lbl" style="margin-top: 15px;">Couleur de la plage</div>
            <div class="sw-row" id="sw-modal">
                <div class="sw" style="background:#1e3a5f" data-c="#1e3a5f"></div>
                <div class="sw" style="background:#1f6f3c" data-c="#1f6f3c"></div>
                <div class="sw" style="background:#5b21b6" data-c="#5b21b6"></div>
                <div class="sw" style="background:#9a3412" data-c="#9a3412"></div>
                <div class="sw" style="background:#7c2d12" data-c="#7c2d12"></div>
                <div class="sw" style="background:#0f4c75" data-c="#0f4c75"></div>
                <div class="sw" style="background:#6d3078" data-c="#6d3078"></div>
                <div class="sw-pick" id="cpick-modal-btn" title="Couleur libre">+<input type="color" id="cpick-modal" value="#1e3a5f" /></div>
            </div>
        </div>
        <div class="mrow">
            <button class="md" id="m-delete">Supprimer</button>
            <button class="mc" id="m-cancel">Annuler</button>
            <button class="cta msave" id="m-save">Enregistrer</button>
        </div>
    </div>
</div>
<div id="toast"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener('DOMContentLoaded', () => {

        const CLASSE_ID = /*[[${classe.id}]]*/ 1;
        const PLAGES_INITIALES = /*[[${plages}]]*/ [];
        const DEBUT_SEMAINE = /*[[${debutSemaine}]]*/ '2024-01-01';

        // ═══════════════════════════════════════════════════
        // JWT
        // ═══════════════════════════════════════════════════
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        const getHeaders = () => {
            const headers = { 'Content-Type': 'application/json' };
            const token = getCookie('JWT_TOKEN');
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        };

        const getFormHeaders = () => {
            const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            const token = getCookie('JWT_TOKEN');
            if (token) headers['Authorization'] = 'Bearer ' + token;
            return headers;
        };

        // ═══════════════════════════════════════════════════
        // STATE ET UTILS
        // ═══════════════════════════════════════════════════
        let calendar, fcDrag;
        let currentEvent = null;
        let isNewEvent = false;
        let modalSelectedTeachers = new Set();
        let modalColor = '#1e3a5f';

        const $ = id => document.getElementById(id);
        let tt;

        function toast(msg, isError = false) {
            clearTimeout(tt);
            const toastEl = $('toast');
            toastEl.textContent = msg;
            toastEl.style.background = isError ? '#dc2626' : 'var(--text)';
            toastEl.classList.add('on');
            tt = setTimeout(() => toastEl.classList.remove('on'), 3000);
        }

        function formatIso(dateObj) {
            const d = new Date(dateObj);
            const tzOffset = d.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(d - tzOffset)).toISOString().slice(0, -1);
            return {
                jour: localISOTime.slice(0, 10),
                heure: localISOTime.slice(11, 19)
            };
        }

        // ═══════════════════════════════════════════════════
        // DRAG & DROP SIDEBAR
        // ═══════════════════════════════════════════════════
        if (FullCalendar.Draggable) {
            fcDrag = new FullCalendar.Draggable($('sb-body'), {
                itemSelector: '.fc-event',
                eventData: el => {
                    const isPause = el.getAttribute('data-pause') === '1';
                    return {
                        title: el.getAttribute('data-title'),
                        backgroundColor: el.getAttribute('data-color'),
                        borderColor: el.getAttribute('data-color'),
                        create: true,
                        extendedProps: {
                            isPause: isPause,
                            programmationUEId: isPause ? null : el.getAttribute('data-prog-id'),
                            enseignantIds: [],
                            salle: ''
                        }
                    };
                }
            });
        }

        // ═══════════════════════════════════════════════════
        // MODALE
        // ═══════════════════════════════════════════════════
        const initModalSwatches = () => {
            const cont = $('sw-modal'), pickBtn = $('cpick-modal-btn'), pick = $('cpick-modal');
            cont.querySelectorAll('.sw').forEach(sw => {
                sw.addEventListener('click', () => {
                    cont.querySelectorAll('.sw, .sw-pick').forEach(s => s.classList.remove('on'));
                    sw.classList.add('on');
                    modalColor = sw.dataset.c;
                });
            });
            pickBtn.addEventListener('click', () => pick.click());
            pick.addEventListener('input', e => {
                cont.querySelectorAll('.sw, .sw-pick').forEach(s => s.classList.remove('on'));
                pickBtn.classList.add('on');
                modalColor = e.target.value;
            });
        };
        initModalSwatches();

        const setModalColor = (color) => {
            const cont = $('sw-modal');
            cont.querySelectorAll('.sw, .sw-pick').forEach(s => s.classList.remove('on'));
            const exact = cont.querySelector(`.sw[data-c="${color}"]`);
            if (exact) exact.classList.add('on');
            else { $('cpick-modal-btn').classList.add('on'); $('cpick-modal').value = color; }
        };

        document.querySelectorAll('.chip-modal').forEach(chip => {
            chip.addEventListener('click', () => {
                const profId = chip.dataset.profId;
                if (modalSelectedTeachers.has(profId)) {
                    modalSelectedTeachers.delete(profId);
                    chip.classList.remove('on');
                } else {
                    modalSelectedTeachers.add(profId);
                    chip.classList.add('on');
                }
            });
        });

        function openModal(event, isNew) {
            currentEvent = event;
            isNewEvent = isNew;
            const isPause = event.extendedProps && event.extendedProps.isPause;
            const matiere = event.title.split('\n')[0] || event.title;
            $('m-titre-matiere').textContent = isPause ? '⏸ PAUSE' : matiere;
            if (isPause) {
                $('m-config-cours').style.display = 'none';
                $('m-desc-pause').style.display = 'block';
                $('m-save').style.display = 'none';
            } else {
                $('m-config-cours').style.display = 'block';
                $('m-desc-pause').style.display = 'none';
                $('m-save').style.display = 'block';
                $('m-salle').value = (event.extendedProps && event.extendedProps.salle) || '';
                modalColor = event.backgroundColor || '#1e3a5f';
                setModalColor(modalColor);
                const existingIds = (event.extendedProps && event.extendedProps.enseignantIds) || [];
                modalSelectedTeachers = new Set(existingIds.map(String));
                document.querySelectorAll('.chip-modal').forEach(chip => {
                    chip.classList.toggle('on', modalSelectedTeachers.has(chip.dataset.profId));
                });
            }
            $('mbg').classList.add('on');
        }

        function closeModal(cancelNew = false) {
            $('mbg').classList.remove('on');
            if (cancelNew && isNewEvent && currentEvent && isNaN(parseInt(currentEvent.id))) {
                currentEvent.remove();
            }
            currentEvent = null;
        }

        $('m-cancel').addEventListener('click', () => closeModal(true));
        $('mbg').addEventListener('click', e => { if (e.target === $('mbg')) closeModal(true); });

        // ── SUPPRIMER ──
        $('m-delete').addEventListener('click', async () => {
            if (!currentEvent) return;
            const realId = currentEvent.id;
            if (!isNaN(parseInt(realId))) {
                try {
                    const res = await fetch(`${BASE_URL}/${realId}/supprimer?classeId=${CLASSE_ID}`, {
                        method: 'POST',
                        headers: getHeaders()
                    });
                    const data = await res.json();
                    if (data.succes !== false) {
                        currentEvent.remove();
                        toast('Plage supprimée');
                    } else {
                        toast(data.message || 'Erreur lors de la suppression', true);
                    }
                } catch (err) {
                    console.error(err);
                    toast('Erreur serveur', true);
                }
            } else {
                currentEvent.remove();
            }
            closeModal(false);
        });

        // ── MODIFIER ──
        $('m-save').addEventListener('click', async () => {
            if (!currentEvent) return;
            const realId = currentEvent.id;
            const salle = $('m-salle').value.trim();
            const profsArr = Array.from(modalSelectedTeachers).map(Number);
            const matiere = currentEvent.title.split('\n')[0];
            const profsNoms = Array.from(modalSelectedTeachers).map(id => {
                const chip = document.querySelector(`.chip-modal[data-prof-id="${id}"]`);
                return chip ? chip.textContent.trim() : '';
            }).filter(n => n).join(' / ');
            const sousTitre = [profsNoms, salle].filter(x => x).join(' · ');
            const nouveauTitre = sousTitre ? `${matiere}\n${sousTitre}` : matiere;
            const startObj = formatIso(currentEvent.start);
            const endObj = formatIso(currentEvent.end || new Date(currentEvent.start.getTime() + 3600000));
            const formData = new URLSearchParams();
            formData.append('classeId', CLASSE_ID);
            formData.append('jour', startObj.jour);
            formData.append('heureDebut', startObj.heure);
            formData.append('heureFin', endObj.heure);
            formData.append('couleur', modalColor);
            formData.append('salle', salle);
            profsArr.forEach(p => formData.append('enseignantIds', p));
            try {
                const res = await fetch(`${BASE_URL}/${realId}/modifier`, {
                    method: 'POST',
                    headers: getFormHeaders(),
                    body: formData.toString()
                });
                currentEvent.setProp('title', nouveauTitre);
                currentEvent.setProp('backgroundColor', modalColor);
                currentEvent.setProp('borderColor', modalColor);
                currentEvent.setExtendedProp('enseignantIds', profsArr);
                currentEvent.setExtendedProp('salle', salle);
                toast('Plage enregistrée !');
            } catch (err) {
                console.error(err);
                toast('Erreur de sauvegarde', true);
            }
            closeModal(false);
        });

        // ═══════════════════════════════════════════════════
        // FULLCALENDAR INIT
        // ═══════════════════════════════════════════════════
        const eventsData = PLAGES_INITIALES.map(p => ({
            id: p.id,
            title: p.titreAffiche + (p.sousTitreAffiche ? '\n' + p.sousTitreAffiche : ''),
            start: p.jour + 'T' + p.heureDebut,
            end: (p.jourFin ? p.jourFin : p.jour) + 'T' + p.heureFin,
            backgroundColor: p.couleur || '#1e3a5f',
            borderColor: p.couleur || '#1e3a5f',
            extendedProps: {
                isPause: p.typeSeance === 'PAUSE',
                programmationUEId: p.programmationUEId,
                salle: p.salle,
                enseignantIds: p.enseignants ? p.enseignants.map(e => e.id) : []
            }
        }));

        calendar = new FullCalendar.Calendar($('calendar'), {
            locale: 'fr',
            initialView: 'timeGridWeek',
            initialDate: DEBUT_SEMAINE,
            firstDay: 1,
            hiddenDays: [0],
            headerToolbar: false,
            dayHeaderFormat: { weekday: 'long', day: 'numeric' },
            slotMinTime: '07:00:00',
            slotMaxTime: '20:00:00',
            slotDuration: '00:30:00',
            allDaySlot: false,
            editable: true,
            droppable: true,

            // ✅ NOUVEAU — permet l'étirement depuis le haut
            eventResizableFromStart: true,

            events: eventsData,

            eventContent(arg) {
                const parts = arg.event.title.split('\n');
                if (arg.event.extendedProps && arg.event.extendedProps.isPause) {
                    return { html: '<div class="ev-pause"><span>⏸ PAUSE</span></div>' };
                }
                return {
                    html: '<div class="ev"><div class="ev-t">' + (parts[0] || '') + '</div>' +
                        (parts[1] ? '<div class="ev-s">' + parts[1] + '</div>' : '') +
                        '</div>'
                };
            },

            async eventReceive(info) {
                const ev = info.event;
                const isPause = ev.extendedProps.isPause;
                const startObj = formatIso(ev.start);
                const endObj = formatIso(ev.end || new Date(ev.start.getTime() + 3600000));
                const payload = {
                    classeId: CLASSE_ID,
                    jour: startObj.jour,
                    heureDebut: startObj.heure,
                    heureFin: endObj.heure,
                    programmationUEId: ev.extendedProps.programmationUEId,
                    typeSeance: isPause ? 'PAUSE' : 'CM',
                    couleur: ev.backgroundColor,
                    titre: isPause ? "PAUSE" : ev.title
                };
                try {
                    const res = await fetch(`${BASE_URL}/drag-drop`, {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.succes) {
                        ev.setProp('id', data.id);
                        if (!isPause) openModal(ev, true);
                    } else {
                        toast(data.message || 'Erreur lors du placement', true);
                        ev.remove();
                    }
                } catch (err) {
                    console.error(err);
                    toast('Erreur de connexion', true);
                    ev.remove();
                }
            },

            eventDrop: handleEventMoveResize,
            eventResize: handleEventMoveResize,  // ✅ gère haut ET bas

            eventClick(info) {
                openModal(info.event, false);
            },

            datesSet(info) {
                const s = info.start;
                const e = new Date(info.end); e.setDate(e.getDate() - 1);
                const f = d => d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' });
                $('wlabel').textContent = `${f(s)} — ${f(e)}`;
            }
        });

        calendar.render();

        // ═══════════════════════════════════════════════════
        // HANDLER DÉPLACEMENT ET REDIMENSIONNEMENT
        // ✅ Envoie heureDebut + heureFin + jour + jourFin
        // ═══════════════════════════════════════════════════
        async function handleEventMoveResize(info) {
            const ev = info.event;
            const startObj = formatIso(ev.start);
            const endObj = formatIso(ev.end);

            const payload = {
                classeId: CLASSE_ID,
                jour: startObj.jour,          // ✅ jour de début (peut changer si déplacé)
                jourFin: endObj.jour,          // ✅ jour de fin (pour multi-jours éventuels)
                heureDebut: startObj.heure,    // ✅ peut changer si étiré vers le haut
                heureFin: endObj.heure,        // ✅ peut changer si étiré vers le bas
                programmationUEId: ev.extendedProps.programmationUEId,
                typeSeance: ev.extendedProps.isPause ? 'PAUSE' : 'CM',
                enseignantIds: ev.extendedProps.enseignantIds
            };

            try {
                const res = await fetch(`${BASE_URL}/${ev.id}/deplacer`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!data.succes) {
                    toast(data.message || 'Conflit horaire', true);
                    info.revert();
                } else {
                    toast('✅ Plage mise à jour');
                }
            } catch (err) {
                console.error(err);
                toast('Erreur de connexion', true);
                info.revert();
            }
        }

        // ═══════════════════════════════════════════════════
        // NAV BAR
        // ═══════════════════════════════════════════════════
        $('btn-prev').addEventListener('click', () => {
            const d = new Date(calendar.view.activeStart);
            d.setDate(d.getDate() - 7);
            window.location.href = `/enseignant/emploi-du-temps/classe/${CLASSE_ID}?semaine=${d.toISOString().slice(0, 10)}`;
        });

        $('btn-next').addEventListener('click', () => {
            const d = new Date(calendar.view.activeStart);
            d.setDate(d.getDate() + 7);
            window.location.href = `/enseignant/emploi-du-temps/classe/${CLASSE_ID}?semaine=${d.toISOString().slice(0, 10)}`;
        });

        $('winput').addEventListener('change', e => {
            if (e.target.value) {
                window.location.href = `/enseignant/emploi-du-temps/classe/${CLASSE_ID}?semaine=${e.target.value}`;
            }
        });
        $('winput').value = DEBUT_SEMAINE;
    });
    /*]]>*/
</script>
</body>
</html>
