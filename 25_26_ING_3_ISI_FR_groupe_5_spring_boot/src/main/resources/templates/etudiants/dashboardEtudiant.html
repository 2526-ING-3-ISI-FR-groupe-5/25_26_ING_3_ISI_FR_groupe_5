<!DOCTYPE html>
<html lang="fr" data-theme="dark"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/app}">
<body>

<div layout:fragment="content">
    <div class="max-w-[800px] mx-auto px-4 py-6">

        <!-- Header -->
        <div class="flex items-center gap-4 mb-8">
            <div class="w-16 h-16 rounded-2xl bg-primary/20 border border-primary/30 flex items-center justify-center text-2xl font-bold text-primary">
                <span th:text="${etudiant != null and etudiant.prenom != null and !#strings.isEmpty(etudiant.prenom) ? #strings.substring(etudiant.prenom,0,1) : 'U'}">U</span>
            </div>
            <div>
                <h1 class="text-2xl font-serif text-white"
                    th:text="${etudiant != null ? (etudiant.prenom ?: '') + ' ' + (etudiant.nom ?: '') : 'Etudiant'}">Nom Étudiant</h1>
                <p class="text-sm text-gray-500"
                   th:text="${etudiant != null and etudiant.classe != null ? etudiant.classe.nom : 'Non affecte'}">Classe</p>
            </div>
        </div>

        <!-- STATS CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-bgcard border border-white/5 p-4 rounded-2xl text-center">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Taux Présence</p>
                <p class="text-2xl font-bold text-emerald-400"
                   th:text="${(stats != null ? stats.tauxPresence : 0) + '%'}">0%</p>
            </div>
            <div class="bg-bgcard border border-white/5 p-4 rounded-2xl text-center">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Absences NJ</p>
                <p class="text-2xl font-bold text-red-400"
                   th:text="${stats != null ? stats.nbAbsencesNJ : 0}">0</p>
            </div>
            <div class="bg-bgcard border border-white/5 p-4 rounded-2xl text-center">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Retards</p>
                <p class="text-2xl font-bold text-amber-400"
                   th:text="${stats != null ? stats.nbRetards : 0}">0</p>
            </div>
            <div class="bg-bgcard border border-white/5 p-4 rounded-2xl text-center">
                <p class="text-[10px] text-gray-500 uppercase mb-1">Justifiées</p>
                <p class="text-2xl font-bold text-blue-400"
                   th:text="${stats != null ? stats.nbAbsencesJ : 0}">0</p>
            </div>
        </div>

        <!-- VALIDATION APPEL (Session Active) -->
        <div th:if="${sessionActive != null}" class="mb-8 p-6 bg-primary/10 border-2 border-primary/20 rounded-[32px] animate-pulse-subtle">
            <h2 class="text-center text-lg font-bold text-white mb-4">📢 Appel en cours : <span th:text="${sessionActive.plageHoraire.getTitreAffiche()}"></span></h2>

            <form th:action="@{/etudiant/valider-presence}" method="post" class="space-y-4">
                <input type="hidden" name="sessionAppelId" th:value="${sessionActive.id}">
                <!-- Géolocalisation via JS -->
                <input type="hidden" name="latitudeEtudiant" id="lat">
                <input type="hidden" name="longitudeEtudiant" id="lon">

                <div class="flex flex-col items-center gap-3">
                    <input type="text" name="codeSaisi" maxlength="6" required
                           placeholder="Code PIN"
                           class="w-full max-w-[200px] bg-bgsubtle border border-white/10 text-center text-2xl font-bold tracking-widest rounded-xl py-3 text-white focus:border-primary outline-none">

                    <button type="submit" onclick="requestLocation()" class="btn bg-primary hover:bg-primaryhover text-white w-full h-12 rounded-xl font-bold">
                        Confirmer ma présence
                    </button>
                    <p id="geo-msg" class="text-[10px] text-gray-500 italic"></p>
                </div>
            </form>
        </div>

        <!-- Messages -->
        <div th:if="${succes}" class="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-400 text-sm" th:text="${succes}"></div>
        <div th:if="${erreur}" class="mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm" th:text="${erreur}"></div>

        <!-- Historique Récent -->
        <div class="bg-bgcard border border-white/5 rounded-[24px] overflow-hidden">
            <div class="p-5 border-b border-white/5">
                <h3 class="font-semibold text-white">Mon historique récent</h3>
            </div>
            <div class="divide-y divide-white/5">
                <div th:each="appel : ${appels}" class="p-4 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-200" th:text="${appel.plageHoraireTitre}">Cours</p>
                        <p class="text-[11px] text-gray-500" th:text="${appel.plageHoraireJour + ' · ' + appel.plageHoraireHeures}">Date</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full"
                          th:classappend="${appel.statut.name() == 'PRESENT' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                                          (appel.statut.name() == 'ABSENT' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20')}"
                          th:text="${appel.statutLibelle}">Statut</span>
                </div>
            </div>
        </div>

    </div>
</div>

<script layout:fragment="scripts">
    function requestLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lon').value = pos.coords.longitude;
                document.getElementById('geo-msg').innerText = "📍 Position capturée";
            });
        }
    }
    // Appel auto au chargement
    window.onload = requestLocation;
</script>

</body>
</html>
